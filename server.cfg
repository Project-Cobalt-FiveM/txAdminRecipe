## Project Cobalt server config, deployed by {{recipeName}}
## Docs and support: https://projectcobalt.net

## Network
{{serverEndpoints}}

## Keys and database (filled in by txAdmin)
sv_licenseKey "{{svLicense}}"
set mysql_connection_string "{{dbConnectionString}}"

## Optional: Steam authentication, key from https://steamcommunity.com/dev/apikey
# set steam_webApiKey "your-key"

## Optional: FiveMesh logs and uploads, key from app.fivemesh.io. Empty turns them off. Use set, never setr.
set fivemesh_api_key ""

## Server identity
sv_hostname "{{serverName}} | Project Cobalt"
sets sv_projectName "{{serverName}}"
sets sv_projectDesc "{{recipeDescription}}"
sets locale "en-US"
sets tags "cobalt, roleplay"
load_server_icon logo.png
sv_maxclients {{maxClients}}
sv_enforceGameBuild 3889

## OneSync is set in txAdmin's settings page, not here
set onesync_population true

## Security
sv_scriptHookAllowed 0
set sv_enableNetworkedPhoneExplosions false
set sv_enableNetworkedSounds false
set sv_filterRequestControl 2
set sv_entityLockdown relaxed
## Clients cannot write replicated state bags, and server code owns player and entity state
setr sv_stateBagStrictMode true
sv_pureLevel 1
## Hide GTA's busy spinner while the loading screen is up (cobalt_loading)
set sv_showBusySpinnerOnLoadingScreen false
## Throw unbelted players through the windscreen in hard crashes (cobalt_hud seatbelt)
setr game_enableFlyThroughWindscreen true

## cobalt_mysql runs queries on a worker thread, which needs this permission.
## It also answers oxmysql, mysql-async and ghmattimysql calls from third-party scripts.
add_unsafe_worker_permission cobalt_mysql

## ox_lib
setr ox:locale "en"

## cobalt_inventory: delete stashes nobody changed for this long ("24 WEEK" or "6 MONTH", or "0" to keep them)
set inventory_stash_cleanup "24 WEEK"
## cobalt_inventory: seconds between saves of changed inventories, lowest 10
set inventory_save_interval 60

## cobalt_core: seconds between saves of changed online players, lowest 10
set player_save_interval 60

## pma-voice
setr voice_useNativeAudio true
setr voice_useSendingRangeOnly true
setr voice_defaultCycle "F11"
setr voice_enableRadios 1
setr voice_enablePhones 1
setr voice_enableUi 1

## Resources, in start order. Add your own resources below cobalt_adminmenu.

## CFX defaults (chat comes from cobalt_chat)
ensure mapmanager
ensure spawnmanager
ensure baseevents

