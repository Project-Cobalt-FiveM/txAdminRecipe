## Admin
ensure cobalt_adminmenu

## Ranks: staff < admin < owner. Each group holds its rank as an ACE and inherits the one below.
add_ace group.staff staff allow
add_ace group.admin admin allow
add_principal group.admin group.staff
add_ace group.owner owner allow
add_ace group.owner command allow
add_ace group.owner command.quit deny
add_principal group.owner group.admin

## Tester: a rank outside the chain that opens only the admin menu actions marked tester = true
add_ace group.tester tester allow
add_ace resource.cobalt_adminmenu command.add_principal allow

## Whitelist: with whitelist mode on, only holders of the whitelisted ACE can join
add_ace group.staff whitelisted allow
# add_ace identifier.license:XXXXXXXXXXXXXXXXXXXX whitelisted allow

add_ace resource.cobalt_core command.add_ace allow
add_ace resource.cobalt_core command.add_principal allow
add_ace resource.cobalt_core command.remove_principal allow
add_ace resource.ox_lib command.add_ace allow
add_ace resource.ox_lib command.remove_ace allow
add_ace resource.ox_lib command.add_principal allow
add_ace resource.ox_lib command.remove_principal allow

## Owner (your txAdmin account)
{{addPrincipalsMaster}}

