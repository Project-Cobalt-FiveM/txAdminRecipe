ensure cobalt_chat

## Economy and player
ensure cobalt_inventory
ensure ox_target
ensure cobalt_banking
ensure cobalt_management
ensure illenium-appearance
ensure cobalt_housing
ensure cobalt_weather
ensure cobalt_multicharacter
ensure npwd

## Vehicles
ensure cobalt_vehiclekeys
ensure ox_fuel
ensure cobalt_garages
ensure cobalt_dealership
